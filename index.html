<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Weather Dashboard - Google Maps Platform Weather API">
  <meta name="theme-color" content="#1a73e8">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
</head>

<body>
  <!-- Error Banner (shown when API fails) -->
  <div id="error-banner" class="error-banner" hidden></div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <div class="app">
    <!-- Header -->
    <header class="header" role="banner">
      <h1 class="app-title">Weather Dashboard</h1>

      <div class="header-controls">
        <!-- Location -->
        <button id="location-btn" class="btn btn-location" aria-label="Current location. Click to re-detect.">
          <span class="location-icon" aria-hidden="true">📍</span>
          <span class="location-name" id="location-name">Detecting…</span>
        </button>

        <input type="text" id="location-input" class="location-input" placeholder="Search location…"
          aria-label="Search for a location" autocomplete="off">

        <!-- Units Toggle -->
        <button id="units-toggle" class="btn" aria-label="Toggle temperature units">
          °C
        </button>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="btn btn-icon" aria-label="Toggle theme">
          💻
        </button>

        <!-- Refresh -->
        <button id="refresh-btn" class="btn btn-icon" aria-label="Refresh weather data" title="Refresh (Ctrl+R)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <!-- Tabs -->
      <div class="tabs" role="tablist" aria-label="Forecast view">
        <button class="tab-btn active" id="tab-today" role="tab" aria-selected="true"
          aria-controls="panel-today">Today</button>
        <button class="tab-btn" id="tab-week" role="tab" aria-selected="false" aria-controls="panel-week">Week</button>
        <button class="tab-btn" id="tab-radar" role="tab" aria-selected="false"
          aria-controls="panel-radar">Radar</button>
      </div>

      <!-- Today panel: current conditions + hourly -->
      <div id="panel-today" class="tab-panel" role="tabpanel" aria-labelledby="tab-today">
        <!-- Current Conditions -->
        <section id="current-section" class="section" aria-labelledby="current-title">
          <h2 id="current-title" class="section-title" style="display: none;">Current Conditions</h2>
          <div id="current-content"></div>
        </section>

        <!-- Hourly Forecast -->
        <section id="hourly-section" class="section" aria-labelledby="hourly-title">
          <h2 id="hourly-title" class="section-title" style="display: none;">Hourly Forecast</h2>
          <div id="hourly-content"></div>
        </section>
      </div>

      <!-- Week panel: daily forecast -->
      <div id="panel-week" class="tab-panel" role="tabpanel" aria-labelledby="tab-week" hidden>
        <section id="daily-section" class="section" aria-labelledby="daily-title">
          <h2 id="daily-title" class="section-title" style="display: none;">Daily Forecast</h2>
          <div class="daily-header">
            <button id="legend-info-btn" class="btn btn-icon" aria-label="Explain temperature bar colors"
              aria-expanded="false" aria-controls="legend-popover">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9.5"></circle>
                <line x1="12" y1="16" x2="12" y2="11.5"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
            </button>
            <div id="legend-popover" class="legend-popover" role="tooltip" hidden></div>
          </div>
          <div id="daily-content"></div>
        </section>
      </div>

      <!-- Radar panel -->
      <div id="panel-radar" class="tab-panel" role="tabpanel" aria-labelledby="tab-radar" hidden>
        <section id="radar-section" class="section" aria-labelledby="radar-title">
          <h2 id="radar-title" class="section-title">Live Radar</h2>
          <div class="radar-card">
            <div id="radar-map" class="radar-map"></div>
            <div class="radar-controls">
              <button id="radar-prev" class="btn btn-icon" aria-label="Previous frame">⏮</button>
              <button id="radar-play" class="btn btn-icon" aria-label="Play/pause animation">▶</button>
              <button id="radar-next" class="btn btn-icon" aria-label="Next frame">⏭</button>
              <span id="radar-timestamp" class="radar-timestamp">Loading…</span>
            </div>
            <div class="precip-strip-header">
              <i class="ti ti-cloud-rain" aria-hidden="true"></i>
              Coming up
            </div>
            <div id="radar-precip-strip" class="precip-strip"></div>
          </div>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
      <span id="api-count" class="api-count">API calls: 0</span>
      <p class="attribution">
        Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> &amp; <a
          href="https://weather.gc.ca/" target="_blank" rel="noopener">ECCC</a> |
        Radar by <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a> |
        Geocoding by <a href="https://nominatim.openstreetmap.org/" target="_blank" rel="noopener">OpenStreetMap
          Nominatim</a>
      </p>
    </footer>
  </div>

  <!-- Leaflet (for radar map) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Modules -->
  <script type="module" src="app.js"></script>
</body>

</html>
