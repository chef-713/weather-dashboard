<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4"/>
      <stop offset="100%" style="stop-color:#34a853"/>
    </linearGradient>
  </defs>
  <!-- Sky background -->
  <rect width="100" height="100" fill="url(#sky)" rx="20"/>
  <!-- Sun -->
  <circle cx="70" cy="30" r="18" fill="#fbbc04"/>
  <!-- Cloud -->
  <g fill="#fff" opacity="0.9">
    <circle cx="35" cy="45" r="14"/>
    <circle cx="50" cy="38" r="16"/>
    <circle cx="62" cy="45" r="12"/>
    <ellipse cx="48" cy="52" rx="20" ry="8"/>
  </g>
  <!-- Rain drops -->
  <g fill="#4285f4" opacity="0.8">
    <ellipse cx="38" cy="72" rx="3" ry="6" transform="rotate(-15 38 72)"/>
    <ellipse cx="50" cy="74" rx="3" ry="7"/>
    <ellipse cx="62" cy="70" rx="2.5" ry="5" transform="rotate(10 62 70)"/>
  </g>
</svg>